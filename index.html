<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#edede8" />
    <meta name="description" content="The temperature your body actually experiences on the street — sun, humidity, wind and surroundings included, with the math visible." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>RealTemp</title>
    <script>
      // Applies a saved manual light/dark override before first paint — no
      // flash of the wrong theme. Absent = follow prefers-color-scheme (the
      // CSS default); this only runs when the user has explicitly chosen.
      try {
        var t = localStorage.getItem('realtemp:theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
